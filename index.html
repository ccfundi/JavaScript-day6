<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Day 6 - Searchable User Directory</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f8f9fa;
        }

        h1{
            text-align: center;
            color: #333;
        }

        .search-container{
            margin-bottom: 25px;
        }

        #search-input{
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 4px solid #007bff;
        }

        .user-card h3{
            margin: 0 0 8px 0;
            color: #007bff;
        }

        .user-card p{
            margin: 4px 0;
            color: #666;
            font-size: 0.95rem;
        }

        .loading{
            text-align: center;
            font-size: 1.1rem;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>Directory Search</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 Search users by name or email...">
    </div>

    <div id="user-list" class="user-grid">
        <div class="loading">Loading user directory...</div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
